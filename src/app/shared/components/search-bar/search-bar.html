<form
  class="flex w-full flex-nowrap items-end gap-2"
  (submit)="onSubmit($event, searchInput.value)"
>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="min-w-0 flex-1">
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      #searchInput
      type="search"
      placeholder="Buscar filmes..."
      aria-label="Buscar filmes"
      [value]="initialQuery"
    />
  </mat-form-field>

  <button matFab extended type="submit" class="flex-shrink-0">Buscar</button>
</form>

@if (loading()) {
  <div data-testid="home-skeleton">
    <section class="mb-8">
      <app-skeleton class="h-64 w-full rounded-xl md:h-96" />
    </section>

    <section>
      <app-skeleton class="mb-4 h-7 w-40 rounded" />

      <div class="flex items-start gap-4">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="flex w-40 flex-shrink-0 flex-col gap-2">
            <app-skeleton class="aspect-[2/3] w-full rounded-lg" />
            <app-skeleton class="h-4 w-full rounded" />
            <app-skeleton class="h-3 w-12 rounded" />
          </div>
        }
      </div>
    </section>
  </div>
} @else if (error()) {
  <div class="flex flex-col items-center gap-4 py-16">
    <p>Não foi possível carregar os filmes agora.</p>
  </div>
} @else {
  <section class="mb-8">
    <h2 class="mb-4 text-xl font-semibold">Lançamentos</h2>
    <app-banner-carousel [movies]="upcomingMovies()" />
  </section>

  <section>
    <h2 class="mb-4 text-xl font-semibold">Populares</h2>
    <app-popular-movies-carousel [movies]="popularMovies()" />
  </section>
}
